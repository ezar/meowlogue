name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch GitHub git dependencies over HTTPS
        # pnpm records GitHub dependencies by their canonical SSH URL in the
        # lockfile, whatever specifier package.json uses. Runners have no SSH
        # key, so `pnpm install` dies on `Permission denied (publickey)` while
        # fetching earshot. This rewrite is what a developer machine with
        # GitHub access effectively has; it makes the runner behave the same.
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch GitHub git dependencies over HTTPS
        # pnpm records GitHub dependencies by their canonical SSH URL in the
        # lockfile, whatever specifier package.json uses. Runners have no SSH
        # key, so `pnpm install` dies on `Permission denied (publickey)` while
        # fetching earshot. This rewrite is what a developer machine with
        # GitHub access effectively has; it makes the runner behave the same.
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The M0 debug page does not need the models: earshot is absent, so
      # nothing loads them. `pnpm models:fetch` becomes a CI step in M1.
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
